<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Photo Gallery - Final Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        #image {
            width: 550px;
            height: 350px;
            border: 4px solid #333;
            margin: 20px auto;
            background-color: #0077b6;
            background-image: url('');
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .preview {
            width: 120px;
            height: 80px;
            object-fit: cover;
            margin: 10px;
            border: 3px solid #ccc;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .preview:hover, .preview:focus {
            border-color: #0077b6;
            transform: scale(1.05);
            outline: none;
        }
    </style>
</head>
<body>

    <h1>Thư viện ảnh có thể truy cập</h1>
    
    <!-- Vùng hiển thị chính -->
    <div id="image">
        Di chuột qua một hình ảnh bên dưới hoặc sử dụng phím Tab để chọn.
    </div>

    <!-- Các ảnh nhỏ (Thumbnail) -->
    <div>
        <img class="preview" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Cảnh thiên nhiên núi non hùng vĩ lúc hoàng hôn">
        <img class="preview" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Con đường mòn xuyên qua khu rừng xanh mát">
        <img class="preview" src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Ánh nắng ban mai chiếu qua tán cây trong rừng">
    </div>

    <script>
        // Yêu cầu 8 & 9: Sử dụng sự kiện onload và vòng lặp để thêm tabindex, sự kiện chuột và bàn phím động
        window.onload = function() {
            console.log("Trang đã tải xong, bắt đầu khởi tạo thư viện ảnh...");
            
            let images = document.querySelectorAll(".preview");
            
            for (let i = 0; i < images.length; i++) {
                // Thêm thuộc tính tabindex tự động qua JavaScript cho khả năng truy cập (Accessibility)
                images[i].setAttribute("tabindex", "0");
                console.log("Đã thêm tabindex cho ảnh thứ " + (i + 1));

                // Gắn sự kiện khi rê chuột vào / focus bằng bàn phím
                images[i].addEventListener("mouseover", function() {
                    upDate(this);
                });
                images[i].addEventListener("focus", function() {
                    upDate(this);
                });

                // Gắn sự kiện khi rời chuột ra / blur bàn phím
                images[i].addEventListener("mouseout", function() {
                    unDo();
                });
                images[i].addEventListener("blur", function() {
                    unDo();
                });
            }
        };

        function upDate(previewPic) {
            console.log("Sự kiện kích hoạt!");
            console.log("Alt text: " + previewPic.alt);
            console.log("Source URL: " + previewPic.src);

            // Cập nhật hình nền và văn bản
            document.getElementById('image').style.backgroundImage = "url('" + previewPic.src + "')";
            document.getElementById('image').innerHTML = previewPic.alt;
        }

        function unDo() {
            console.log("Sự kiện hoàn tác kích hoạt!");
            
            // Khôi phục lại trạng thái ban đầu
            document.getElementById('image').style.backgroundImage = "url('')";
            document.getElementById('image').innerHTML = "Di chuột qua một hình ảnh bên dưới hoặc sử dụng phím Tab để chọn.";
        }
    </script>

</body>
</html>
