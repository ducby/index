<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        #image {
            width: 550px;
            height: 350px;
            border: 4px solid #333;
            margin: 20px auto;
            background-color: #0077b6;
            background-image: url('');
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .preview {
            width: 120px;
            height: 80px;
            object-fit: cover;
            margin: 10px;
            border: 3px solid #ccc;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .preview:hover {
            border-color: #0077b6;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Thư viện ảnh tương tác</h1>
    
    <!-- Vùng hiển thị chính -->
    <div id="image">
        Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
    </div>

    <!-- Các ảnh nhỏ (Thumbnail) đáp ứng cả yêu cầu di chuột và khả năng truy cập (tabindex) -->
    <div>
        <img class="preview" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Cảnh thiên nhiên núi non hùng vĩ lúc hoàng hôn" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
        
        <img class="preview" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Con đường mòn xuyên qua khu rừng xanh mát" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
        
        <img class="preview" src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d" alt="Ánh nắng ban mai chiếu qua tán cây trong rừng" onmouseover="upDate(this)" onmouseout="unDo()" onfocus="upDate(this)" onblur="unDo()" tabindex="0">
    </div>

    <script>
        function upDate(previewPic) {
            // Kiểm tra sự kiện và in thông tin ra console theo đúng yêu cầu bài tập
            console.log("Sự kiện di chuột đã kích hoạt!");
            console.log("Alt text: " + previewPic.alt);
            console.log("Source URL: " + previewPic.src);

            // Thay đổi hình nền của div #image thành src của ảnh được trỏ tới
            document.getElementById('image').style.backgroundImage = "url('" + previewPic.src + "')";
            
            // Thay đổi nội dung văn bản thành thuộc tính alt của ảnh
            document.getElementById('image').innerHTML = previewPic.alt;
        }

        function unDo() {
            console.log("Sự kiện rời chuột đã kích hoạt!");
            
            // Khôi phục lại hình nền ban đầu (trống)
            document.getElementById('image').style.backgroundImage = "url('')";
            
            // Khôi phục lại văn bản gốc ban đầu
            document.getElementById('image').innerHTML = "Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.";
        }
    </script>

</body>
</html>
